  # =========================================================================
  # 4. NGINX LOAD BALANCER
  # =========================================================================
  api-loadbalancer:
    image: nginx:alpine
    ports:
      - "5038:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - livesync-api
      - livesync-realtime
      - livesync-sandbox