services:
  # =========================================================================
  # 1. FRONTEND
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - api-loadbalancer

  # =========================================================================
  # 2. NEW POLYGLOT BACKEND MICROSERVICES (ACTIVE)
  # =========================================================================
  # 2a. Java Spring Boot REST API
  livesync-api:
    build:
      context: ./new-backend/livesync/livesync-api
      dockerfile: Dockerfile
    depends_on:
      - livesync-sandbox
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - LIVESYNC_DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/livesync?options=-c%20timezone=UTC
      - LIVESYNC_DATABASE_USERNAME=devuser
      - LIVESYNC_DATABASE_PASSWORD=devpassword
      - LIVESYNC_JWT_SECRET=LiveSync-Development-Only-Secret-Change-Me!
      - LIVESYNC_SANDBOX_BASE_URL=http://livesync-sandbox:8080/
      - LIVESYNC_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2b. Python FastAPI Code Execution Sandbox
  livesync-sandbox:
    build:
      context: ./new-backend/livesync/livesync-sandbox
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=Development
      - DEFAULT_TIMEOUT_MS=10000

  # 2c. Node.js Socket.IO Realtime Engine
  livesync-realtime:
    build:
      context: ./new-backend/livesync/livesync-realtime
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    environment:
      - PORT=5000
      - REDIS_URL=redis://:LocalDevPassword123!@host.docker.internal:6379
      - API_BASE_URL=http://api-loadbalancer:80/
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038
    extra_hosts:
      - "host.docker.internal:host-gateway"

