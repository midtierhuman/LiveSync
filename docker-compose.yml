services:
  # =========================================================================
  # 0. DATABASE & CACHE SERVICES (SELF-CONTAINED STACK)
  # =========================================================================
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${LIVESYNC_POSTGRES_USERNAME:-devuser}
      POSTGRES_PASSWORD: ${LIVESYNC_POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: livesync
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIVESYNC_POSTGRES_USERNAME:-devuser} -d livesync"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${LIVESYNC_REDIS_PASSWORD:-LocalDevPassword123!}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LIVESYNC_REDIS_PASSWORD:-LocalDevPassword123!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # 1. FRONTEND
  # =========================================================================
  ui:
    build:
      context: ./livesync-ui
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - api-loadbalancer

  # =========================================================================
  # 2. POLYGLOT BACKEND MICROSERVICES
  # =========================================================================
  # 2a. Go High-Performance REST API & Persistence Engine
  api:
    build:
      context: ./livesync-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - LIVESYNC_POSTGRES_USERNAME=${LIVESYNC_POSTGRES_USERNAME:-devuser}
      - LIVESYNC_POSTGRES_PASSWORD=${LIVESYNC_POSTGRES_PASSWORD:-devpassword}
      - LIVESYNC_DATABASE_URL=postgres://${LIVESYNC_POSTGRES_USERNAME:-devuser}:${LIVESYNC_POSTGRES_PASSWORD:-devpassword}@postgres:5432/livesync?sslmode=disable
      - LIVESYNC_REDIS_URL=redis://:${LIVESYNC_REDIS_PASSWORD:-LocalDevPassword123!}@redis:6379/0
      - LIVESYNC_JWT_SECRET=${LIVESYNC_JWT_SECRET:-LiveSync-Development-Only-Secret-Change-Me!}
      - LIVESYNC_JWT_ISSUER=LiveSyncAuthAPI
      - LIVESYNC_JWT_AUDIENCE=LiveSyncClient
      - LIVESYNC_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038

  # 2b. Python AI Code Intelligence & AST Analyzer
  ai:
    build:
      context: ./livesync-ai
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=Development
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://host.docker.internal:8080}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-Qwen2.5-Coder-14B-Instruct-Q4_K_M}
      - JWT_SECRET=${LIVESYNC_JWT_SECRET:-LiveSync-Development-Only-Secret-Change-Me!}
      - JWT_ISSUER=LiveSyncAuthAPI
      - JWT_AUDIENCE=LiveSyncClient
      - CORS_ALLOWED_ORIGINS=["http://localhost:4200","http://localhost:4000","http://localhost:5038"]

  # 2c. Node.js Socket.IO Realtime Engine
  realtime:
    build:
      context: ./livesync-realtime
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=5000
      - REDIS_URL=redis://:${LIVESYNC_REDIS_PASSWORD:-LocalDevPassword123!}@redis:6379
      - API_BASE_URL=http://api-loadbalancer:80/
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038

  # 2d. Go High-Performance API Gateway & Live Terminal PTY Engine
  gateway:
    build:
      context: ./livesync-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - ai
    environment:
      - PORT=8081
      - LIVESYNC_AI_GRPC_URL=ai:50051
      - LIVESYNC_SANDBOX_GRPC_URL=ai:50051
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://host.docker.internal:8080}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-Qwen2.5-Coder-14B-Instruct-Q4_K_M}
      - LIVESYNC_JWT_SECRET=${LIVESYNC_JWT_SECRET:-LiveSync-Development-Only-Secret-Change-Me!}
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038

  # =========================================================================
  # 4. NGINX LOAD BALANCER
  # =========================================================================
  api-loadbalancer:
    image: nginx:alpine
    stop_signal: SIGQUIT
    stop_grace_period: 1s
    ports:
      - "5038:80"
    volumes:
      - ./livesync-infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - realtime
      - ai

  # =========================================================================
  # 5. OBSERVABILITY (PROMETHEUS & GRAFANA) - (Disabled in Dev)
  # =========================================================================
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./livesync-infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   depends_on:
  #     - sandbox
  #
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
  #   depends_on:
  #     - prometheus

volumes:
  postgres-data:
  redis-data: