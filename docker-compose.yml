services:
  # =========================================================================
  # 1. FRONTEND
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - api-loadbalancer

  # =========================================================================
  # 2. NEW POLYGLOT BACKEND MICROSERVICES (ACTIVE)
  # =========================================================================
  # 2a. Java Spring Boot REST API
  livesync-api:
    build:
      context: ./backend/livesync-api
      dockerfile: Dockerfile
    depends_on:
      - livesync-sandbox
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - LIVESYNC_DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/livesync?options=-c%20timezone=UTC
      - LIVESYNC_DATABASE_USERNAME=devuser
      - LIVESYNC_DATABASE_PASSWORD=devpassword
      - LIVESYNC_JWT_SECRET=LiveSync-Development-Only-Secret-Change-Me!
      - LIVESYNC_SANDBOX_BASE_URL=http://livesync-sandbox:8080/
      - LIVESYNC_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2b. Python FastAPI Code Execution Sandbox
  livesync-sandbox:
    build:
      context: ./backend/livesync-sandbox
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=Development
      - DEFAULT_TIMEOUT_MS=15000
      - CORS_ALLOWED_ORIGINS=["http://localhost:4200","http://localhost:4000","http://localhost:5038"]



  # 2c. Node.js Socket.IO Realtime Engine
  livesync-realtime:
    build:
      context: ./backend/livesync-realtime
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    environment:
      - PORT=5000
      - REDIS_URL=redis://:LocalDevPassword123!@host.docker.internal:6379
      - API_BASE_URL=http://api-loadbalancer:80/
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================================================================
  # 4. NGINX LOAD BALANCER
  # =========================================================================
  api-loadbalancer:
    image: nginx:alpine
    ports:
      - "5038:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - livesync-api
      - livesync-realtime
      - livesync-sandbox

  # =========================================================================
  # 5. OBSERVABILITY (PROMETHEUS & GRAFANA)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: livesync-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/livesync-infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - livesync-sandbox

  grafana:
    image: grafana/grafana:latest
    container_name: livesync-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus