services:
  # 1. Angular Frontend
  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - api-loadbalancer

  # 2. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: livesync
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Redis Cache & State Store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 4. Java Spring Boot REST API
  livesync-api:
    build:
      context: ../livesync-api
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - livesync-sandbox
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - LIVESYNC_DATABASE_URL=jdbc:postgresql://postgres:5432/livesync?options=-c%20timezone=UTC
      - LIVESYNC_DATABASE_USERNAME=devuser
      - LIVESYNC_DATABASE_PASSWORD=devpassword
      - LIVESYNC_JWT_SECRET=LiveSync-Development-Only-Secret-Change-Me!
      - LIVESYNC_SANDBOX_BASE_URL=http://livesync-sandbox:8080/
      - LIVESYNC_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038

  # 5. Python FastAPI Code Execution Sandbox
  livesync-sandbox:
    build:
      context: ../livesync-sandbox
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=Development
      - DEFAULT_TIMEOUT_MS=10000

  # 6. Node.js Socket.IO Realtime Engine
  livesync-realtime:
    build:
      context: ../livesync-realtime
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    depends_on:
      - redis
      - livesync-api
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://livesync-api:8080/
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4000,http://localhost:5038

  # 7. Nginx Load Balancer
  api-loadbalancer:
    image: nginx:alpine
    ports:
      - "5038:80"
    volumes:
      - ../../../nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - livesync-api
      - livesync-realtime
      - livesync-sandbox

volumes:
  postgres_data:
