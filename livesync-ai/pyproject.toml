[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livesync-ai"
version = "1.0.0"
description = "High-performance AI code intelligence and static AST complexity analysis microservice for LiveSync operating over native gRPC on port 50051"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=5.0.0",
    "psutil>=6.0.0",
    "PyJWT>=2.9.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
