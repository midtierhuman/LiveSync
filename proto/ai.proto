syntax = "proto3";

package ai;

option go_package = "github.com/livesync/livesync-gateway/pb";

service AIService {
  rpc GetLanguages (Empty) returns (LanguagesResponse);
  rpc AnalyzeCode (AiAnalysisRequest) returns (AiAnalysisResponse);
  rpc StreamAnalyzeCode (AiAnalysisRequest) returns (stream AiAnalysisChunk);
}

message Empty {}

message LanguageDescriptor {
  string name = 1;
  string display_name = 2;
}

message LanguagesResponse {
  repeated LanguageDescriptor languages = 1;
}

message ProjectFile {
  string path = 1;
  string content = 2;
}

message AiAnalysisRequest {
  string action = 1;
  string language = 2;
  string code = 3;
  string prompt = 4;
  string model = 5;
  string user_api_key = 6;
  string project_id = 7;
  repeated ProjectFile project_files = 8;
  string provider = 9;
}

message AiAnalysisResponse {
  string action = 1;
  string language = 2;
  string explanation = 3;
  repeated string suggestions = 4;
  string generated_code = 5;
  string provider = 6;
}

message AiAnalysisChunk {
  string delta = 1;
  string stage = 2;              // "analyzing", "streaming", "complete", "error"
  string action = 3;
  string language = 4;
  string provider = 5;
  repeated string suggestions = 6;
  string generated_code = 7;
  bool is_final = 8;
}
