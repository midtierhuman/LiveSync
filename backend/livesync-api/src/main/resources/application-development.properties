# Activate locally with: -Dspring.profiles.active=development
spring.datasource.url=${LIVESYNC_DATABASE_URL:jdbc:postgresql://localhost:5432/livesync?options=-c%20timezone=UTC}
spring.datasource.username=${LIVESYNC_DATABASE_USERNAME:devuser}
spring.datasource.password=${LIVESYNC_DATABASE_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

livesync.jwt.secret=${LIVESYNC_JWT_SECRET:LiveSync-Development-Only-Secret-Change-Me!}
livesync.jwt.issuer=LiveSyncAuthAPI
livesync.jwt.audience=LiveSyncClient
livesync.jwt.expiration-hours=24
livesync.sandbox.base-url=http://localhost:5152/
livesync.cors.allowed-origins=http://localhost:4200,https://localhost:4200