spring.application.name=livesync-api
spring.datasource.url=${LIVESYNC_DATABASE_URL:}
spring.datasource.username=${LIVESYNC_DATABASE_USERNAME:}
spring.datasource.password=${LIVESYNC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

livesync.jwt.secret=${LIVESYNC_JWT_SECRET:}
livesync.jwt.issuer=${LIVESYNC_JWT_ISSUER:LiveSyncAuthAPI}
livesync.jwt.audience=${LIVESYNC_JWT_AUDIENCE:LiveSyncClient}
livesync.jwt.expiration-hours=${LIVESYNC_JWT_EXPIRATION_HOURS:24}
livesync.sandbox.base-url=${LIVESYNC_SANDBOX_BASE_URL:http://localhost:5152/}
livesync.cors.allowed-origins=${LIVESYNC_CORS_ALLOWED_ORIGINS:}
