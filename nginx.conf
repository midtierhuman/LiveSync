events { worker_connections 1024; }

http {
    # Docker Embedded DNS Resolver (dynamic container IP resolution)
    resolver 127.0.0.11 valid=5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream for Java Spring Boot REST API
    upstream backend_api {
        server livesync-api:8080;
    }

    # Upstream for Node.js / Socket.IO Realtime Engine
    upstream backend_realtime {
        ip_hash;
        server livesync-realtime:5000;
    }

    # Upstream for Python FastAPI Code Execution Sandbox
    upstream backend_sandbox {
        server livesync-sandbox:8080;
    }

    server {
        listen 80;

        # Code Execution Sandbox endpoints -> livesync-sandbox (with WebSocket streaming support)
        location /api/execution/ {
            proxy_pass http://backend_sandbox;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Standard REST API endpoints -> livesync-api
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time WebSockets (/hubs/ and /socket.io/) -> livesync-realtime
        location /hubs/ {
            proxy_pass http://backend_realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /socket.io/ {
            proxy_pass http://backend_realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Catch-all fallback -> livesync-api
        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}