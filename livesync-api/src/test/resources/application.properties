spring.datasource.url=jdbc:h2:mem:livesync;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
livesync.jwt.secret=development-test-secret-that-is-at-least-32-bytes
livesync.jwt.issuer=LiveSyncAuthAPI
livesync.jwt.audience=LiveSyncClient
livesync.jwt.expiration-hours=24
livesync.sandbox.base-url=http://localhost:5152/
livesync.cors.allowed-origins=
