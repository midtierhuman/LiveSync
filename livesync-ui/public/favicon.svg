<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan to Violet Gradient -->
    <linearGradient id="ls-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Emerald to Cyan Gradient -->
    <linearGradient id="ls-emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="ls-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Larger Top-Right Sync Arc -->
  <path d="M 256,36 A 220,220 0 0,1 476,256 A 220,220 0 0,1 410,410" fill="none" stroke="url(#ls-cyan-violet)" stroke-width="52" stroke-linecap="round" filter="url(#ls-glow)" />
  <!-- Arrowhead Top-Right -->
  <path d="M 416,56 L 476,36 L 496,96" fill="none" stroke="url(#ls-cyan-violet)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Larger Bottom-Left Sync Arc -->
  <path d="M 256,476 A 220,220 0 0,1 36,256 A 220,220 0 0,1 102,102" fill="none" stroke="url(#ls-emerald-cyan)" stroke-width="52" stroke-linecap="round" filter="url(#ls-glow)" />
  <!-- Arrowhead Bottom-Left -->
  <path d="M 96,456 L 36,476 L 16,416" fill="none" stroke="url(#ls-emerald-cyan)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Larger Central Code Prompt Chevron '>' -->
  <path d="M 165,170 L 265,256 L 165,342" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Larger Cursor Line '_' -->
  <line x1="300" y1="342" x2="365" y2="342" stroke="#00F2FE" stroke-width="48" stroke-linecap="round" />
</svg>
